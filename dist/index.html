<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills Library</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25324a;background:#f6f7fa;font-synthesis:none;--muted:#8290a6;--border:#e7eaf1;--blue:#4d68d8}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #9bb0ff;outline-offset:3px}button{border:0;background:none}header{height:74px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.5px;font-size:17px}.brandmark{width:32px;height:32px;background:#26334b;color:#fff;border-radius:10px;display:grid;place-items:center;font-size:21px}.header-right{display:flex;gap:22px;align-items:center}.local{font-size:11px;color:#8994a6}.local::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#75b68d;margin-right:7px}.refresh{font-size:12px;border:1px solid var(--border);padding:9px 13px;border-radius:8px;background:#fff}.refresh:hover{border-color:#bec9e0}aside{position:fixed;left:0;top:74px;bottom:0;width:250px;background:#fff;border-right:1px solid var(--border);padding:27px 17px 18px;display:flex;flex-direction:column}.side-title{font-size:10px;letter-spacing:1.7px;color:#98a2b2;font-weight:700;padding:0 14px;margin-bottom:14px}nav{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#e0e5ed transparent}.nav-section{margin:23px 13px 9px;text-transform:uppercase;letter-spacing:1.4px;font-size:9px;font-weight:750;color:#9ba5b5}.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:3px 0;border-radius:8px;color:#65738a;font-size:12px;line-height:1.45}.nav-item:hover{background:#f7f8fb;color:#26334b}.nav-item.active{background:#eef1ff;color:#4c64c6;font-weight:650}.nav-label{flex:1}.nav-count{font-size:10px;color:#9ba5b7;font-weight:500}.active .nav-count{color:#6c80d0}.nav-icon{width:18px;text-align:center;font-size:13px;color:#9ba5b7}.nav-number{font-size:10px;font-variant-numeric:tabular-nums}.side-foot{border-top:1px solid var(--border);margin:18px 12px 0;padding-top:17px;font-size:10px;line-height:1.7;color:#9ca6b7}main{margin-left:250px;padding:30px 44px 60px;max-width:1540px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.breadcrumb{color:#9ba5b5;font-size:11px}.breadcrumb span{padding:0 9px;color:#c5ccd8}.tabs{display:flex;padding:4px;background:#e9ecf2;border-radius:10px;gap:3px}.tabs button{font-size:11px;padding:8px 16px;border-radius:7px;color:#8490a3}.tabs button[aria-selected="true"]{background:#fff;color:#25324a;box-shadow:0 1px 5px #26334b0d;font-weight:650}.view-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:#6d82cd;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin-bottom:10px}h1{font-size:32px;letter-spacing:-1.1px;line-height:1.2;margin:0 0 10px;font-weight:650}.subtitle{font-size:12px;line-height:1.8;color:#8c97a9;margin:0;max-width:650px}.view-count{flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 13px;font-size:11px;color:#8d98a8}.view-count strong{color:#40506a;font-weight:650;margin-right:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:21px 21px 0;min-height:215px;display:flex;flex-direction:column;transition:border-color .16s,box-shadow .16s}.card:hover{border-color:#cdd6eb;box-shadow:0 7px 24px #27355107}.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}.skill-icon{width:35px;height:35px;border-radius:10px;background:#f0f3ff;color:#7286ce;display:grid;place-items:center}.skill-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}.category{font-size:9px;color:#8997ad;letter-spacing:.2px;text-align:right;max-width:65%;line-height:1.5}.card h2{font-size:14px;line-height:1.5;letter-spacing:-.15px;font-weight:650;margin:0 0 8px;overflow-wrap:anywhere}.card-description{font-size:12px;line-height:1.8;color:#79869c;margin:0 0 19px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-foot{margin-top:auto;border-top:1px solid #f0f2f6;padding:12px 0;display:flex;align-items:center;justify-content:space-between}.read{font-size:10px;color:#7082bd;padding:2px 0}.read span{margin-left:5px}.read:hover{color:#334eaa}.trash{padding:4px;border-radius:5px;color:#b1b9c7;display:grid;place-items:center}.trash:hover{background:#fff0ef;color:#c7726b}.trash svg{height:14px;width:14px;stroke:currentColor;fill:none;stroke-width:1.5}.readonly{font-size:9px;color:#bcc3d0}.plugin-card{cursor:pointer;text-align:left}.plugin-card:hover{border-color:#aebee9}.plugin-card .skill-icon{font-size:12px;font-weight:700;letter-spacing:-.5px}.plugin-card .card-description{margin-bottom:25px}.plugin-card .card-foot{color:#7283b4;font-size:10px}.notice{font-size:10px;color:#a0aabc;margin:23px 0 0;line-height:1.8}.empty{padding:55px 0;color:#8b97aa;font-size:13px}.toast{position:fixed;bottom:24px;left:calc(50% + 125px);transform:translateX(-50%);background:#25324a;color:white;border-radius:10px;box-shadow:0 6px 20px #0002;padding:13px 20px;font-size:12px;z-index:20}dialog{border:1px solid var(--border);border-radius:17px;width:min(850px,94vw);max-height:88vh;padding:0;color:#25324a;background:#fff}dialog::backdrop{background:#1e2b4555;backdrop-filter:blur(5px)}.dialog-head{padding:25px 28px;border-bottom:1px solid var(--border);display:flex;align-items:start;justify-content:space-between;gap:20px}.dialog-head h2{margin:5px 0 0;font-size:23px;letter-spacing:-.6px;overflow-wrap:anywhere}.small-label{font-size:10px;color:#8d9ab0}.close{font-size:20px;color:#98a3b6}.dialog-body{padding:25px 28px}.dialog-body p{font-size:13px;color:#8490a4;line-height:1.9}.path{font:10px/1.8 ui-monospace,monospace;color:#a0aabb;overflow-wrap:anywhere}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.action{font-size:11px;border:1px solid var(--border);background:#fff;padding:9px 13px;border-radius:7px}.action:hover{background:#f7f9fd}.danger{color:#bd6c65;border-color:#ecdcd9}.primary{background:#25324a;color:white;border-color:#25324a}.primary:hover{background:#394962}pre{font:11px/1.9 ui-monospace,SFMono-Regular,monospace;color:#6d7a90;background:#f7f8fb;border:1px solid #edf0f6;padding:21px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:9px}.delete-title{margin-top:0;font-size:21px}#deleteError{color:#ba625c}@media(min-width:1500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1100px){main{padding:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}aside{width:220px}main{margin-left:220px}.topline{align-items:start;gap:15px}.toast{left:calc(50% + 110px)}}@media(max-width:720px){header{height:62px;padding:0 18px}.local{display:none}aside{position:relative;top:auto;bottom:auto;width:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px}.side-title,.nav-section,.side-foot{display:none}nav{display:flex;gap:5px;overflow-x:auto;align-items:center}.nav-item{width:auto;flex-shrink:0;margin:0;padding:8px 10px}.nav-count{margin-left:3px}.nav-icon{display:none}main{margin-left:0;padding:22px 18px}.topline{flex-direction:column;gap:18px;margin-bottom:25px}.tabs{width:100%}.tabs button{flex:1;padding:9px}.view-head{align-items:start}h1{font-size:27px}.view-count{padding:7px}.grid{gap:12px}.card{padding:16px 16px 0;min-height:215px}.card h2{font-size:13px}.category{font-size:8px}.toast{left:50%;max-width:90%;width:max-content}.dialog-body,.dialog-head{padding:20px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.card{min-height:195px}}

/* Larger type and stronger contrast throughout the navigation and cards. */
aside{width:285px;padding:25px 17px 16px}main{margin-left:285px;padding:30px 36px 60px}.side-title{font-size:12px;color:#63718a}.nav-item{font-size:15px;color:#485972;padding:10px 12px}.nav-count{font-size:12px;color:#697b95}.nav-section{font-size:11px;color:#6c7c94;margin-top:20px}.nav-icon{font-size:15px}.side-foot{display:none}.card{min-height:245px;border-top:3px solid var(--accent,#7489db);box-shadow:0 3px 12px #27355104}.card h2{font-size:18px;color:#24344e;line-height:1.4}.card-description{font-size:14px;color:#596b85;line-height:1.7;-webkit-line-clamp:3}.category{font-size:11px;color:#647590}.read{font-size:13px;color:#4c65ae}.trash{padding:7px;color:#8c9ab1}.trash svg{width:17px;height:17px}.skill-icon{width:43px;height:43px;background:var(--wash,#edf1ff);color:var(--accent,#627bd0)}.skill-icon svg{width:23px;height:23px}.card[data-tone="blue"]{--accent:#587dd0;--wash:#edf3ff}.card[data-tone="teal"]{--accent:#2d938a;--wash:#e9f7f3}.card[data-tone="rose"]{--accent:#bc6b87;--wash:#fbedf2}.card[data-tone="violet"]{--accent:#8a6bc4;--wash:#f2ecfb}.card[data-tone="amber"]{--accent:#ba8b36;--wash:#faf3e3}.tabs button{font-size:13px}.subtitle{font-size:14px;color:#667791}.eyebrow{font-size:12px}.view-count{font-size:13px}.step-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px}.grid{gap:20px}.compact-heading{grid-column:1/-1;border-top:1px solid #dce3ed;margin-top:25px;padding-top:26px}.compact-heading h2{font-size:18px;margin:0 0 6px}.compact-heading p{font-size:13px;color:#7888a0;margin:0}.compact-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.compact-card{min-height:0;padding:12px 15px;border-top:1px solid var(--border);flex-direction:row;align-items:center;gap:12px;box-shadow:none}.compact-card .card-top,.compact-card .card-description{display:none}.compact-card h2{font-size:14px;flex:1;margin:0;color:#586b85}.compact-card .card-foot{margin:0;border:0;padding:0;gap:10px;flex-shrink:0}.compact-card .read{font-size:11px}.compact-card .trash svg{width:13px;height:13px}.compact-card .trash{padding:4px}.dialog-body p{color:#5e708b}.dialog-body pre{font-size:12px}.breadcrumb{font-size:13px}.refresh{font-size:13px}@media(max-width:1100px){aside{width:255px}main{margin-left:255px;padding:26px}.card h2{font-size:17px}}@media(max-width:720px){aside{width:auto;padding:12px}main{margin-left:0;padding:22px 18px}.nav-item{font-size:14px;padding:9px 12px}.card h2{font-size:17px}.compact-grid{grid-template-columns:1fr}.card-description{font-size:14px}.compact-card h2{font-size:14px}}
</style></head>
<body>
<header><div class="brand"><span class="brandmark">⌘</span>Skills library</div><div class="header-right"><span class="local">On your Mac</span><button class="refresh" id="refresh">↻ Refresh</button></div></header>
<aside><div class="side-title" id="sideTitle">YOUR COLLECTION</div><nav id="navigation" aria-label="Skill categories"></nav><div class="side-foot">A home for your workflows.<br>Stored locally. Ready when you need them.</div></aside>
<main><div class="topline"><div class="breadcrumb">Library<span>/</span><span id="breadcrumb" style="padding:0;color:#66768f">My skills</span></div><div class="tabs" role="tablist" aria-label="Skill collections"><button role="tab" id="tab-mine" data-source="Mine" aria-controls="libraryPanel" aria-selected="true">My skills</button><button role="tab" id="tab-plugins" data-source="External" aria-controls="libraryPanel" aria-selected="false" tabindex="-1">Plugins</button><button role="tab" id="tab-system" data-source="System" aria-controls="libraryPanel" aria-selected="false" tabindex="-1">System</button></div></div>
<section id="libraryPanel" role="tabpanel" aria-labelledby="tab-mine"><div class="view-head"><div><div class="eyebrow" id="eyebrow">YOUR TOOLKIT</div><h1 id="viewTitle">My skills</h1><p class="subtitle" id="subtitle">The workflows you’ve made your own.</p></div><div class="view-count" id="viewCount">Loading…</div></div><div id="grid" class="grid"></div><p class="notice" id="notice"></p></section></main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="detail" aria-labelledby="detailName"><div class="dialog-head"><div><div class="small-label" id="detailSource"></div><h2 id="detailName"></h2></div><button class="close" id="close" aria-label="Close skill details">×</button></div><div class="dialog-body"><p id="detailDescription"></p><div class="path" id="detailPath"></div><div class="actions"><button class="action" id="copyName">Copy skill name</button><button class="action" id="copyContent">Copy instructions</button><button class="action danger" id="detailDelete">Move to Trash</button></div><p id="deleteNote" class="path"></p><pre id="content"></pre></div></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteName"><div class="dialog-body"><h2 class="delete-title" id="deleteName"></h2><p id="deleteExplanation"></p><div class="path" id="deletePath"></div><p id="deleteError" role="alert"></p><div class="actions"><button class="action" id="cancelDelete">Keep skill</button><button class="action danger" id="confirmDelete">Move to Trash</button></div></div></dialog>
<script>
const $=id=>document.getElementById(id);let skills=[],groups=[],token=null,selected=null,activeSource='Mine',loaded=false,toastTimer,aliases={},summaries={},compactSections=[];const current={Mine:'all',External:'all',System:'all'};
const titles={Mine:'My skills',External:'Plugins',System:'System skills'};
const descriptions={Mine:'Your personal workflows, organised around what you do.',External:'Browse the skills that come with each plugin.',System:'The built-in tools that help Codex work.'};
function nice(name){return aliases[name]||name.split('-').map((word,i)=>i===0?word.charAt(0).toUpperCase()+word.slice(1):word).join(' ').replace(/hyperframes/gi,'HyperFrames').replace(/\bcli\b/g,'CLI').replace(/\bmvp\b/g,'MVP').replace(/\boauth\b/g,'OAuth')}
function sourceLabel(s){return s.plugin?(s.pluginLabel||s.plugin)+' plugin':s.source==='Mine'?'Personal skill':'System skill'}
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function skillVisual(s){
 let tone='blue',shape='<path d="M8 4h8l4 4v12H4V4h4m6 0v6h6M8 14h8m-8 3h5"/>';
 if(s.name.includes('design')||s.groups.includes('marketing-images')){tone='rose';shape='<path d="m4 16 9-11 6 5-9 11H4v-5Zm7-9 6 5M4 16l6 5"/>'}
 else if(s.groups.includes('marketing-video')){tone=s.name.includes('upload')||s.name.includes('talking-head')?'rose':s.name.includes('compress')||s.name.includes('marketing-motion')?'amber':s.name==='media-use'||s.name==='create-demo'||s.name==='viral-format-research'?'teal':'violet';shape='<rect x="3" y="5" width="14" height="14" rx="3"/><path d="m17 10 4-3v10l-4-3M8 9l5 3-5 3V9Z"/>'}
 else if(s.groups.includes('marketing-seo')){tone='teal';shape='<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 12l3-4 3 2"/>'}
 else if(s.name.includes('build')||s.name.includes('setup')||s.plugin){tone='blue';shape='<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/>'}
 else if(s.name.includes('metrics')||s.name.includes('reports')){tone='amber';shape='<path d="M4 20V12h4v8m4 0V4h4v16m4 0v-6M2 20h20"/>'}
 else if(s.name.includes('definition')){tone='teal';shape='<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>'}
 return {tone,icon:'<svg viewBox="0 0 24 24" aria-hidden="true">'+shape+'</svg>'}
}
const trashMarkup='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg>';
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function navButton(label,count,id){const button=node('button','nav-item'+(current[activeSource]===id?' active':''));button.setAttribute('aria-current',current[activeSource]===id?'page':'false');const match=label.match(/^(\d+)\.\s*(.*)/);button.append(node('span','nav-icon'+(match?' nav-number':''),match?match[1]:'◈'),node('span','nav-label',match?match[2]:label),node('span','nav-count',count));button.onclick=()=>{current[activeSource]=id;render();window.scrollTo({top:0,behavior:'instant'})};return button}
function render(){
 const tabSkills=skills.filter(s=>s.source===activeSource);
 const rawGroups=groups.map(g=>({...g,items:tabSkills.filter(s=>s.groups.includes(g.id))})).filter(g=>g.items.length);
 let available=rawGroups;
 if(current[activeSource]!=='all'&&!available.some(g=>g.id===current[activeSource]))current[activeSource]='all';
 const selectedGroup=available.find(g=>g.id===current[activeSource]);let items=[...(selectedGroup?selectedGroup.items:tabSkills)];
 items.sort((a,b)=>{
 const compact=(a.compactOrder||0)-(b.compactOrder||0);if(compact)return compact;
 if(selectedGroup){const order=(a.groupOrder?.[selectedGroup.id]??999)-(b.groupOrder?.[selectedGroup.id]??999);if(order)return order}
 else if(activeSource==='Mine'){for(let i=0;i<2;i++){const order=(a.catalogOrder?.[i]??999)-(b.catalogOrder?.[i]??999);if(order)return order}}
 return a.name.localeCompare(b.name)
 });
 for(const tab of document.querySelectorAll('[role=tab]')){const active=tab.dataset.source===activeSource;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;if(active)$('libraryPanel').setAttribute('aria-labelledby',tab.id)}
 $('breadcrumb').textContent=titles[activeSource];$('sideTitle').textContent=activeSource==='External'?'YOUR PLUGINS':activeSource==='System'?'BUILT INTO CODEX':'YOUR COLLECTION';
 const nav=$('navigation');nav.replaceChildren(navButton(activeSource==='External'?'All plugins':activeSource==='System'?'All system skills':'All my skills',activeSource==='External'?available.length:tabSkills.length,'all'));
 let lastArea='';if(activeSource!=='System')for(const g of available){if(g.section!==lastArea){lastArea=g.section;nav.append(node('div','nav-section',g.section))}nav.append(navButton(g.label,g.items.length,g.id))}
 const pluginOverview=activeSource==='External'&&!selectedGroup;
 $('eyebrow').textContent=selectedGroup?(selectedGroup.kind==='plugin'?'PLUGIN COLLECTION':selectedGroup.area):activeSource==='External'?'CONNECTED CAPABILITIES':activeSource==='System'?'THE ESSENTIALS':'YOUR TOOLKIT';
 $('viewTitle').textContent=selectedGroup?selectedGroup.label:titles[activeSource];
 $('subtitle').textContent=selectedGroup?(selectedGroup.description||'Choose a skill to read its instructions or copy its name.'):descriptions[activeSource];
 $('viewCount').replaceChildren(node('strong','',loaded?(pluginOverview?available.length:items.length):'…'),document.createTextNode(' '+(pluginOverview?'plugins':'skills')));
 $('notice').textContent=activeSource==='External'?'These entries come from your plugin cache. Availability in Codex depends on which plugins are enabled.':activeSource==='System'?'System skills are managed by Codex and are read only.':'';
 const grid=$('grid');grid.replaceChildren();
 if(pluginOverview){for(const g of available){const card=node('button','card plugin-card');card.setAttribute('aria-label','View '+g.label+' plugin');const top=node('div','card-top');top.append(node('span','skill-icon',g.label.slice(0,2).toUpperCase()),node('span','category','PLUGIN'));card.append(top,node('h2','',g.label),node('p','card-description',g.items.length+' skills in this collection.'),node('div','card-foot','View skills →'));card.onclick=()=>{current.External=g.id;render();window.scrollTo({top:0,behavior:'instant'})};grid.append(card)}}
 else {const compactContainers=new Map();for(const s of items){
 const compact=s.compactSection;let compactContainer=compactContainers.get(compact);
 if(compact&&!compactContainer){const section=compactSections.find(section=>section.id===compact);const divider=node('div','compact-heading');divider.append(node('h2','',section.label),node('p','',section.description+' · '+items.filter(item=>item.compactSection===compact).length+' skills'));grid.append(divider);compactContainer=node('div','compact-grid');grid.append(compactContainer);compactContainers.set(compact,compactContainer)}const card=node('article','card'+(compact?' compact-card':''));const visual=skillVisual(s);card.dataset.tone=visual.tone;const top=node('div','card-top');const icon=node('span','skill-icon');icon.innerHTML=visual.icon;const g=selectedGroup||rawGroups.find(group=>s.groups.includes(group.id));top.append(icon,node('span','category',s.plugin?(s.pluginLabel||s.plugin):activeSource==='System'?'SYSTEM':g?.area==='Overview'?'Workflow':(g?.area==='Other workflows'?g.label:g?.area)||'Personal'));const description=(summaries[s.name]||s.description).replace(/\s+/g,' ').trim();const short=description.length>115?description.slice(0,112).trim()+'…':description;if(selectedGroup?.show_steps&&s.steps?.[selectedGroup.id]){const step=node('span','step-label','STEP '+s.steps[selectedGroup.id]);top.lastChild.replaceWith(step)}card.append(top,node('h2','',nice(s.name)),node('p','card-description',short));const foot=node('div','card-foot');const read=node('button','read','Open skill  ↗');read.setAttribute('aria-label','Open '+s.name);read.onclick=()=>show(s);foot.append(read);if(s.deletable){const del=node('button','trash');del.innerHTML=trashMarkup;del.setAttribute('aria-label','Delete '+s.name);del.title='Move to Trash';del.onclick=()=>askDelete(s);foot.append(del)}else foot.append(node('span','readonly','Read only'));card.append(foot);(compact?compactContainer:grid).append(card)}}
 if(loaded&&!items.length&&!pluginOverview)grid.append(node('div','empty','There are no skills in this collection.'));
}
function show(s){selected=s;$('detailSource').textContent=sourceLabel(s)+' · '+s.name;$('detailName').textContent=nice(s.name);$('detailDescription').textContent=s.description;$('detailPath').textContent=s.path;$('content').textContent=s.content;$('detailDelete').hidden=!s.deletable;$('deleteNote').textContent=s.plugin?'Plugin updates may restore deleted cached skills.':'';$('detail').showModal()}
async function load(){
 $('refresh').disabled=true;
 try{const response=await fetch('/api/skills');if(!response.ok)throw new Error();const data=await response.json();skills=data.skills;groups=data.groups;aliases=data.display?.names||{};summaries=data.display?.summaries||{};compactSections=data.compactSections||[];token=data.token;loaded=true;render();return true}
 catch(e){notify('Could not load skills. Check the local server.');return false}
 finally{$('refresh').disabled=false}
}
function askDelete(s){selected=s;$('deleteName').textContent='Move “'+nice(s.name)+'” to Trash?';$('deleteExplanation').textContent='The skill folder'+(s.copies.length>1?' and its identical cached copies':'')+' will be removed from its current location. You can restore it from Finder’s Trash.'+(s.plugin?' Plugin updates may restore it.':'');$('deletePath').textContent=s.path;$('deleteError').textContent='';$('confirmDelete').disabled=false;$('deleteDialog').showModal()}
async function deleteSelected(){const s=selected,scrollPosition=window.scrollY;$('confirmDelete').disabled=true;try{const response=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json','X-Library-Token':token},body:JSON.stringify({id:s.id})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not delete this skill');$('deleteDialog').close();$('detail').close();await load();window.scrollTo({top:scrollPosition,behavior:'instant'});notify(nice(s.name)+' moved to Trash.')}catch(e){$('deleteError').textContent=e.message;$('confirmDelete').disabled=false}}
async function copy(button,value){try{await navigator.clipboard.writeText(value);notify('Copied to clipboard.')}catch(e){notify('Copy unavailable. You can select the instructions below.')}}
for(const tab of document.querySelectorAll('[role=tab]')){tab.onclick=()=>{activeSource=tab.dataset.source;render();window.scrollTo({top:0,behavior:'instant'})};tab.onkeydown=e=>{const tabs=[...document.querySelectorAll('[role=tab]')],index=tabs.indexOf(tab);let next;if(e.key==='ArrowRight')next=tabs[(index+1)%3];if(e.key==='ArrowLeft')next=tabs[(index+2)%3];if(e.key==='Home')next=tabs[0];if(e.key==='End')next=tabs[2];if(next){e.preventDefault();next.click();next.focus()}}}
$('refresh').onclick=load;$('close').onclick=()=>$('detail').close();$('detailDelete').onclick=()=>askDelete(selected);$('cancelDelete').onclick=()=>$('deleteDialog').close();$('confirmDelete').onclick=deleteSelected;$('copyName').onclick=()=>copy($('copyName'),selected.name);$('copyContent').onclick=()=>copy($('copyContent'),selected.content);render();load();
</script></body></html>
